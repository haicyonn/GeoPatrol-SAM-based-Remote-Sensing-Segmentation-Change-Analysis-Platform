<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>遥感变化智能巡检平台</title>
  <style>
    :root {
      --bg:#070b12; --panel:#0d1320; --panel2:#111827; --line:#263348;
      --text:#f3f7fb; --muted:#9eb0c7; --sub:#6f8198;
      --amber:#f4b64b; --amber2:#f07b45; --teal:#49d0bd; --green:#78d99b; --red:#f56b73;
      --shadow: 0 28px 80px rgba(0,0,0,.42);
      --preview-height:clamp(420px,calc(100vh - 300px),590px);
    }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    a, a:link, a:visited, a:hover, a:active { color:inherit; text-decoration:none; }
    body { overflow:hidden; background:
      radial-gradient(circle at 18% 12%, rgba(244,182,75,.12), transparent 28%),
      radial-gradient(circle at 82% 18%, rgba(73,208,189,.10), transparent 30%),
      linear-gradient(180deg,#080d16 0%,#05070c 100%); }
    button, input, select, textarea { font:inherit; color:inherit; }
    .landing { position:relative; height:100vh; min-height:720px; padding:30px 36px; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; -ms-overflow-style:none; }
    .landing::-webkit-scrollbar { width:0; height:0; }
    .landing::before { content:""; position:absolute; inset:0; background-image:linear-gradient(90deg, rgba(7,11,18,.99) 0%, rgba(7,11,18,.82) 39%, rgba(7,11,18,.38) 100%), url('ui-assets/brand/hero-evidence-agent.png'); background-size:cover; background-position:center; filter:saturate(1.03); }
    .landing::after { content:""; position:absolute; inset:0; background-image:linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px), linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px); background-size:44px 44px; opacity:.42; mask-image:linear-gradient(90deg,#000 0%,transparent 86%); }
    #flowCanvas { position:absolute; inset:0; z-index:1; opacity:.78; }
    .landing-inner { position:relative; z-index:2; max-width:1660px; height:100%; margin:0 auto; display:grid; grid-template-columns:minmax(460px,1fr) minmax(420px,560px); gap:48px; align-items:start; justify-content:space-between; }
    .hero-copy { padding-top:74px; max-width:690px; }
    .eyebrow { color:var(--amber); font-weight:900; letter-spacing:.10em; font-size:13px; text-transform:uppercase; }
    h1 { margin:13px 0 14px; font-size:46px; line-height:1.08; letter-spacing:0; max-width:720px; }
    .lead { color:#c8d5e6; font-size:16px; line-height:1.62; max-width:650px; }
    .mission-flow { margin-top:28px; max-width:640px; border-top:1px solid rgba(160,184,214,.22); border-bottom:1px solid rgba(160,184,214,.14); display:grid; grid-template-columns:repeat(4,1fr); background:linear-gradient(90deg,rgba(8,14,24,.54),rgba(8,14,24,.16)); }
    .flow-step { position:relative; min-height:54px; display:flex; align-items:center; gap:8px; padding:10px 12px; }
    .flow-step:not(:last-child)::after { content:""; position:absolute; right:0; top:16px; bottom:16px; width:1px; background:rgba(160,184,214,.18); }
    .flow-step span { color:#49d0bd; font-size:11px; font-weight:900; }
    .flow-step b { color:#dfe8f4; font-size:13px; }
    .flow-step.active { color:#ffe1a7; }
    .flow-step.active span { color:var(--amber); }
    .flow-step.active::before { content:""; position:absolute; left:0; right:0; top:-1px; height:1px; background:linear-gradient(90deg,var(--amber),transparent); }
    .hero-actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:24px; }
    .hero-actions .btn { display:inline-flex; align-items:center; justify-content:center; }
    .btn { border:1px solid rgba(255,255,255,.16); background:rgba(12,18,30,.72); padding:12px 16px; cursor:pointer; border-radius:2px; transition:.18s ease; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
    a.btn, a.btn:link, a.btn:visited, a.btn:hover, a.btn:active { color:inherit; text-decoration:none !important; }
    .btn.primary { background:linear-gradient(135deg,var(--amber),var(--amber2)); color:#101014; border:0; font-weight:900; }
    a.btn.primary, a.btn.primary:link, a.btn.primary:visited, a.btn.primary:hover, a.btn.primary:active { color:#101014; text-decoration:none !important; }
    .btn.ghost { background:rgba(8,12,20,.58); }
    .btn:hover { transform:translateY(-1px); border-color:rgba(244,182,75,.62); }
    .ops-dock { margin-top:20px; max-width:640px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .ops-tile { position:relative; min-height:72px; border:1px solid rgba(160,184,214,.20); background:linear-gradient(180deg,rgba(10,17,29,.78),rgba(5,10,18,.74)); color:#dce9f7; padding:12px 13px; cursor:pointer; text-align:left; overflow:hidden; }
    .ops-tile::before { content:""; position:absolute; left:0; top:12px; bottom:12px; width:2px; background:linear-gradient(180deg,rgba(73,208,189,.74),rgba(73,208,189,.12)); }
    .ops-tile:hover { border-color:rgba(244,182,75,.58); background:linear-gradient(135deg,rgba(244,182,75,.12),rgba(8,14,24,.78)); }
    .ops-tile.active { border-color:rgba(73,208,189,.48); background:linear-gradient(135deg,rgba(73,208,189,.12),rgba(8,14,24,.80)); }
    .ops-tile b { display:block; font-size:15px; }
    .ops-tile span { display:block; margin-top:7px; color:#8ea2ba; font-size:12px; line-height:1.35; }
    .deploy-panel { max-width:640px; margin-top:10px; border:1px solid rgba(73,208,189,.22); background:rgba(5,11,19,.74); padding:12px; animation:drawerOpen .2s ease-out both; }
    .deploy-head { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; color:#dce9f7; }
    .deploy-head b { font-size:14px; }
    .deploy-head span { color:#7f94ad; font-size:12px; }
    .deploy-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .deploy-grid label { display:grid; gap:5px; color:#8ea2ba; font-size:11px; }
    .deploy-grid input { min-width:0; height:32px; border:1px solid rgba(155,176,205,.22); background:rgba(4,8,15,.78); padding:0 8px; outline:none; }
    .deploy-grid input:focus { border-color:rgba(73,208,189,.56); }
    .region-side { margin-top:58px; display:block; min-width:0; width:min(100%,560px); justify-self:end; align-self:start; height:calc(100dvh - 138px); max-height:calc(100dvh - 138px); overflow-y:auto; overflow-x:hidden; padding:0 4px 34px 0; scrollbar-width:none; -ms-overflow-style:none; overscroll-behavior:auto; }
    .region-side::-webkit-scrollbar { width:0; height:0; }
    .evidence-drawer { position:relative; height:var(--preview-height); max-height:var(--preview-height); border:1px solid rgba(73,208,189,.26); background:linear-gradient(180deg,rgba(6,13,22,.90),rgba(4,8,15,.88)); box-shadow:0 20px 52px rgba(0,0,0,.22); padding:12px; overflow-y:auto; overflow-x:hidden; scrollbar-width:none; -ms-overflow-style:none; animation:drawerOpen .24s ease-out both; }
    .evidence-drawer[data-primary-preview="true"] { margin-top:30px; }
    .evidence-drawer.closing { animation:drawerClose .28s ease-in both; pointer-events:none; overflow:hidden; }
    .evidence-drawer::-webkit-scrollbar { width:0; height:0; }
    .evidence-drawer::before { content:""; position:absolute; left:0; top:10px; bottom:10px; width:2px; background:linear-gradient(180deg,rgba(73,208,189,.82),rgba(73,208,189,.12)); }
    .preview-head { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:10px; }
    .preview-head b { font-size:15px; }
    .preview-head span { color:#8ba0b8; font-size:12px; }
    .preview-rows { display:grid; gap:10px; }
    .preview-row { display:grid; grid-template-columns:minmax(92px,.72fr) repeat(3,minmax(88px,104px)); gap:10px; align-items:center; }
    .preview-meta { min-width:0; }
    .preview-meta b { display:block; color:#f2f7ff; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .preview-meta span { display:block; margin-top:4px; color:#7f94ad; font-size:11px; }
    .preview-tile { position:relative; margin:0; border:1px solid rgba(255,255,255,.11); background:#060b13; overflow:hidden; min-height:0; aspect-ratio:1/1; transition:border-color .18s ease, box-shadow .18s ease; }
    .preview-tile img { display:block; width:100%; height:100%; object-fit:cover; opacity:.92; transition:opacity .18s ease; }
    .preview-tile:hover { border-color:rgba(244,182,75,.72); box-shadow:0 14px 34px rgba(0,0,0,.34); }
    .preview-tile span { position:absolute; left:0; right:0; bottom:0; display:block; padding:6px 7px; color:#dbe8f7; background:linear-gradient(180deg,transparent,rgba(2,6,12,.88)); font-size:11px; font-weight:900; }
    .image-popover { position:fixed; z-index:80; width:min(42vw,520px); aspect-ratio:1/1; border:1px solid rgba(244,182,75,.72); background:#050910; box-shadow:0 24px 72px rgba(0,0,0,.62), 0 0 32px rgba(244,182,75,.16); padding:8px; pointer-events:none; opacity:0; transform:translateY(8px) scale(.98); transition:opacity .16s ease, transform .16s ease; }
    .image-popover.show { opacity:1; transform:none; }
    .image-popover img { display:block; width:100%; height:100%; object-fit:cover; }
    .image-popover span { position:absolute; left:8px; right:8px; bottom:8px; padding:9px 10px; color:#fff3d9; background:linear-gradient(180deg,transparent,rgba(0,0,0,.76)); font-weight:900; font-size:13px; }
    .region-stack { display:grid; gap:12px; overflow:visible; padding-right:0; scrollbar-width:none; -ms-overflow-style:none; }
    .region-stack.focused { min-height:calc(100vh - 126px); }
    .region-stack::-webkit-scrollbar { width:0; height:0; }
    .region-list { display:grid; gap:12px; overflow:visible; max-height:none; padding-right:4px; scrollbar-width:none; -ms-overflow-style:none; }
    .region-list::-webkit-scrollbar { width:0; height:0; }
    .region-card[data-region]:not([data-primary="true"]) { max-height:0; opacity:0; transform:translateY(-8px); margin-top:-12px; padding-top:0; padding-bottom:0; border-width:0; pointer-events:none; transition:max-height .2s ease, opacity .2s ease, transform .2s ease, margin-top .2s ease, padding .2s ease, border-width .2s ease; transition-delay:.2s; }
    .evidence-drawer:not([data-primary-preview="true"]) { height:0; max-height:0; opacity:0; transform:translateY(-8px); margin-top:-12px; padding-top:0; padding-bottom:0; border-width:0; pointer-events:none; transition:height .2s ease, max-height .2s ease, opacity .2s ease, transform .2s ease, margin-top .2s ease, padding .2s ease, border-width .2s ease; transition-delay:.2s; }
    .region-stack:not(.focused):hover .region-card[data-region]:not([data-primary="true"]) { max-height:240px; opacity:1; transform:none; margin-top:0; padding:13px 15px 13px 18px; border-width:1px; pointer-events:auto; transition-delay:.2s; }
    .region-stack:not(.focused):hover .evidence-drawer:not([data-primary-preview="true"]) { height:clamp(220px, calc(100dvh - 340px), 340px); max-height:clamp(220px, calc(100dvh - 340px), 340px); opacity:1; transform:none; margin-top:0; padding:12px; border-width:1px; pointer-events:auto; transition-delay:.2s; }
    .region-stack.expanded .region-card[data-region]:not([data-primary="true"]),
    .region-stack.searching .region-card[data-region]:not([data-primary="true"]) { max-height:240px; opacity:1; transform:none; margin-top:0; padding:13px 15px 13px 18px; border-width:1px; pointer-events:auto; transition-delay:0s; }
    .region-stack.expanded .evidence-drawer:not([data-primary-preview="true"]),
    .region-stack.searching .evidence-drawer:not([data-primary-preview="true"]) { height:clamp(220px, calc(100dvh - 340px), 340px); max-height:clamp(220px, calc(100dvh - 340px), 340px); opacity:1; transform:none; margin-top:0; padding:12px; border-width:1px; pointer-events:auto; transition-delay:0s; }
    .region-stack.collapsing .region-card[data-region]:not([data-primary="true"]),
    .region-stack.collapsing .evidence-drawer:not([data-primary-preview="true"]) { max-height:0; opacity:0; transform:translateY(-8px); margin-top:-12px; pointer-events:none; transition-delay:0s; }
    .region-intro { display:grid; grid-template-columns:auto minmax(150px,220px); align-items:center; gap:12px; padding:0 2px 2px; color:#cbd8e8; }
    .region-intro b { font-size:15px; }
    .region-stack.focused .region-intro { grid-template-columns:minmax(0,1fr) auto; }
    .region-focus-title { display:flex; align-items:center; gap:8px; min-width:0; }
    .region-focus-title span { color:#8398b1; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .region-focus-back { height:34px; border:1px solid rgba(155,176,205,.24); background:rgba(6,11,19,.68); color:#dce8f5; padding:0 12px; cursor:pointer; font-size:12px; font-weight:900; }
    .region-focus-back:hover { border-color:rgba(244,182,75,.64); color:#ffe0a0; }
    .region-stack.focused .region-card { animation:focusCardIn .3s ease-out both; }
    .region-stack.focused .evidence-drawer { height:clamp(260px, calc(100dvh - 330px), 470px); max-height:clamp(260px, calc(100dvh - 330px), 470px); }
    .region-search { height:34px; border:1px solid rgba(155,176,205,.24); background:rgba(6,11,19,.66); color:#dfe9f5; padding:0 10px; outline:none; font-size:12px; }
    .region-search:focus { border-color:rgba(73,208,189,.58); box-shadow:0 0 0 2px rgba(73,208,189,.08); }
    .metric-row { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
    .metric-card, .region-card, .panel, .window { border:1px solid rgba(160,184,214,.26); background:linear-gradient(180deg,rgba(16,24,38,.94),rgba(7,12,21,.94)); box-shadow:var(--shadow); }
    .metric-card { padding:16px; min-height:96px; }
    .metric-label { color:#8ca0bb; font-size:13px; }
    .metric-value { margin-top:8px; font-size:34px; font-weight:900; }
    .metric-note { margin-top:4px; color:#7d91aa; font-size:12px; }
    .region-card { padding:13px 15px 13px 18px; cursor:pointer; display:grid; gap:10px; position:relative; overflow:hidden; transition:border-color .18s ease, background .18s ease, transform .18s ease; }
    .region-card::before { display:none; }
    .region-card.active::after, .region-card:hover::after, .region-card.hovered::after { content:""; position:absolute; left:0; top:14px; bottom:14px; width:2px; background:linear-gradient(180deg,rgba(73,208,189,.76),rgba(73,208,189,.18)); }
    .region-card:hover::after, .region-card.hovered::after { background:linear-gradient(180deg,rgba(244,182,75,.88),rgba(244,182,75,.20)); }
    .region-card:hover, .region-card.hovered { border-color:rgba(244,182,75,.78); background:linear-gradient(135deg,rgba(244,182,75,.16),rgba(17,24,39,.88)); }
    .region-copy { min-width:0; padding-right:196px; }
    .region-card h3 { margin:0; color:#f5f9ff; font-size:21px; display:flex; align-items:center; gap:8px; }
    .region-card p { margin:3px 0 0; color:#a9b9cd; line-height:1.35; font-size:13px; }
    .region-card-actions { position:absolute; top:13px; right:14px; z-index:3; display:flex; align-items:center; gap:8px; }
    .region-console-btn { position:static; min-height:32px; border:1px solid rgba(73,208,189,.34); background:rgba(6,16,24,.78); color:#bff8ef; padding:0 11px; cursor:pointer; font-size:12px; font-weight:900; transition:border-color .18s ease, background .18s ease, color .18s ease; }
    .region-console-btn:hover { border-color:rgba(244,182,75,.74); background:rgba(244,182,75,.16); color:#ffe2a6; }
    .region-console-btn:disabled { cursor:not-allowed; opacity:.42; border-color:rgba(155,176,205,.22); color:#8b9bb0; background:rgba(8,13,22,.72); }
    .region-delete-btn { min-height:32px; border:1px solid rgba(255,120,138,.30); background:rgba(33,9,14,.82); color:#ffc0c7; padding:0 10px; cursor:pointer; font-size:11px; font-weight:900; transition:border-color .18s ease, background .18s ease, color .18s ease; }
    .region-delete-btn:hover { border-color:rgba(255,150,162,.78); background:rgba(125,24,40,.24); color:#ffe0e4; }
    .region-delete-btn:disabled { cursor:not-allowed; opacity:.42; border-color:rgba(155,176,205,.22); color:#8b9bb0; background:rgba(8,13,22,.72); }
    .region-stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .mini-stat { border:1px solid rgba(255,255,255,.09); padding:7px 9px; background:rgba(255,255,255,.025); }
    .mini-stat b { display:block; color:#f4f8ff; font-size:17px; }
    .mini-stat span { color:#94a7bd; font-size:11px; }
    .region-empty { display:none; border:1px solid rgba(155,176,205,.18); background:rgba(8,12,20,.68); color:#8fa2ba; padding:12px 14px; font-size:13px; }
    .region-empty.show { display:block; }
    .upload-card { border-style:dashed; border-color:rgba(73,208,189,.34); background:linear-gradient(135deg,rgba(73,208,189,.08),rgba(17,24,39,.76)); }
    .upload-card.active { border-color:rgba(73,208,189,.58); background:linear-gradient(135deg,rgba(73,208,189,.13),rgba(17,24,39,.84)); }
    .upload-drop { border:1px solid rgba(73,208,189,.24); background:rgba(4,10,18,.46); min-height:52px; display:grid; place-items:center start; padding:9px 12px; cursor:pointer; }
    .upload-drop b { font-size:16px; }
    .upload-drop span, .upload-status { color:#8098b3; font-size:12px; }
    .upload-card.has-files .upload-status { color:#aef5e9; }
    .hidden-file { display:none; }
    .badge-row { display:flex; flex-wrap:wrap; gap:6px; }
    .badge { display:inline-flex; align-items:center; min-height:24px; padding:3px 8px; border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.04); font-size:12px; font-weight:800; }
    .tone-regional { background:rgba(244,182,75,.18); color:#ffd889; border-color:rgba(244,182,75,.40); }
    .tone-local { background:rgba(73,208,189,.14); color:#99f3e6; border-color:rgba(73,208,189,.35); }
    .tone-complex { background:rgba(245,107,115,.14); color:#ffc1c5; border-color:rgba(245,107,115,.35); }
    .tone-quiet { background:rgba(143,160,184,.12); color:#cbd5e1; }
    .workspace-overlay { position:fixed; inset:0; z-index:20; padding:22px; background:rgba(3,6,12,.78); backdrop-filter:blur(8px); opacity:0; pointer-events:none; transition:.22s ease; }
    body.workspace-active .workspace-overlay { padding-bottom:22px; }
    .workspace-overlay.open { opacity:1; pointer-events:auto; }
    .window { height:100%; max-width:1780px; margin:0 auto; display:grid; grid-template-rows:auto auto 1fr; transform:translateY(18px) scale(.985); opacity:.4; transition:.24s ease; overflow:hidden; }
    .workspace-overlay.open .window { transform:none; opacity:1; }
    .window-top { padding:16px 18px; border-bottom:1px solid rgba(255,255,255,.10); display:flex; align-items:center; justify-content:space-between; gap:18px; }
    .window-title b { display:block; font-size:27px; }
    .window-title span { display:block; color:#93a7c0; margin-top:5px; }
    .tabs { display:flex; border:1px solid rgba(255,255,255,.12); }
    .tab { border:0; border-right:1px solid rgba(255,255,255,.12); background:transparent; padding:12px 17px; cursor:pointer; color:#a9bad0; white-space:nowrap; }
    .tab.active { background:var(--amber); color:#101014; font-weight:900; }
    .toolbar { padding:12px 18px; border-bottom:1px solid rgba(255,255,255,.08); display:grid; grid-template-columns:270px 210px 1fr 160px; gap:12px; }
    .search, select { height:44px; border:1px solid rgba(155,176,205,.28); background:#0b111d; padding:0 14px; border-radius:2px; outline:none; }
    .grid-2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .detail label { display:grid; gap:7px; color:#c5d3e6; font-weight:800; }
    .scope-pill { min-height:44px; border:1px solid rgba(244,182,75,.34); background:rgba(244,182,75,.08); display:flex; align-items:center; padding:0 14px; color:#ffd889; font-weight:900; }
    .region-switcher { position:relative; min-width:0; z-index:8; }
    .region-scope-btn { width:100%; justify-content:space-between; gap:12px; cursor:pointer; text-align:left; font:inherit; }
    .region-scope-btn::after { content:""; flex:0 0 auto; width:7px; height:7px; border-right:1px solid currentColor; border-bottom:1px solid currentColor; transform:translateY(-2px) rotate(45deg); transition:transform .18s ease; }
    .region-switcher.open .region-scope-btn::after { transform:translateY(2px) rotate(225deg); }
    .region-switch-menu { position:absolute; left:0; right:0; top:calc(100% + 7px); border:1px solid rgba(160,184,214,.26); background:rgba(7,12,21,.98); box-shadow:0 22px 50px rgba(0,0,0,.46); padding:6px; opacity:0; transform:translateY(-6px); pointer-events:none; transition:opacity .16s ease, transform .16s ease; }
    .region-switcher.open .region-switch-menu { opacity:1; transform:none; pointer-events:auto; }
    .region-switch-option { width:100%; min-height:48px; border:1px solid transparent; background:transparent; color:#dce7f5; padding:8px 10px; cursor:pointer; display:flex; align-items:center; justify-content:space-between; gap:12px; text-align:left; }
    .region-switch-option b { font-size:13px; }
    .region-switch-option span { color:#7f93ab; font-size:11px; white-space:nowrap; }
    .region-switch-option:hover { border-color:rgba(73,208,189,.34); background:rgba(73,208,189,.08); }
    .region-switch-option.active { border-color:rgba(244,182,75,.42); background:rgba(244,182,75,.10); color:#ffe0a0; }
    .view { min-height:0; overflow:hidden; animation:fadeSlide .24s ease both; }

    [/evidence JSON/gi, '后台证据'],
    [/JSON object/gi, '结构化对象'],
    [/JSON/g, '结构化数据'],
    [/Verifier/g, '可信校验'],
    [/F1/g, '检测质量'],
    [/IoU/g, '重叠质量'],
    [/bbox/gi, '变化范围'],
    [/mask/gi, '变化范围'],
    [/overlay/gi, '变化叠加图'],
    [/预测掩膜/g, '变化范围'],
    [/掩膜/g, '变化范围'],
    [/未标注/g, '未配置'],
    [/证据包/g, '后台证据'],
    [/英文类别标签/g, '内部类别标签']

    .replace(/默认抽检复核/g, '中风险复核')
    .replace(/抽检复核/g, '中风险复核')

    .map(poly => {

        .map(point => Array.isArray(point) && point.length >= 2 ? `${Math.round(Number(point[0]) || 0)},${Math.round(Number(point[1]) || 0)}` : '')

        .join(' ');

function refreshApprovedReviewAssets(sampleId, stamp='') {
  const id = String(sampleId || '').trim();
  if (!id) return;
  clearManualPreviewAssets(id);
  const keys = ['mask', 'predMask', 'pred_mask', 'overlay', 'predOverlay', 'pred_overlay'];
  for (const region of allRegions()) {
    for (const row of (region?.items || [])) {
      if (String(row?.id || '') !== id || !row?.assets) continue;
      keys.forEach(key => {
        if (row.assets[key]) row.assets[key] = cacheBustAssetUrl(row.assets[key], stamp);

  }

async function completeCurrentReview(item) {
  const status = $('bboxStatus');
  const reviewBtn = $('approveReviewBtn');
  if (!item) return null;
  if (status) status.textContent = '正在审批回写当前修正结果...';
  if (reviewBtn) reviewBtn.disabled = true;
  try {
    let rec = await saveCurrentCorrection(item);
    if (!rec) return null;
    rec = withReviewDraft(item, rec);
    const data = await callReviewCompleteApi(item, rec);
    const map = loadCorrections();
    const approvedAt = String(data?.updatedAt || new Date().toISOString()).replace(' ', 'T');
    map[item.id] = {
      ...(map[item.id] || rec),
      ...rec,
      review_closed: true,
      approved_at: approvedAt,
      updated_at: approvedAt,
      persisted: data?.persisted !== false,
      evidence_hash: data?.evidenceHash || rec.evidence_hash || '',
      persist_error: ''
    };
    saveCorrections(map);
    updateJudgeMark(item, 'manualVerified', true);
    updateJudgeMark(item, 'queuedForReview', false);
    const refreshStamp = data?.updatedAt || approvedAt || Date.now();
    if (Array.isArray(data?.regions)) {
      hydrateLiveAppRegions(data.regions);
      state.liveDataLoaded = true;
      state.liveDataRegionId = String(item?.regionId || activeRegion()?.id || '');
      state.liveDataUpdatedAt = data.updatedAt || state.liveDataUpdatedAt;
    }
    refreshApprovedReviewAssets(item.id, refreshStamp);
    if (status) status.textContent = '审批回写完成，当前样本已从复核队列移除。';
    renderAll();
    return map[item.id];
  } catch (err) {
    const map = loadCorrections();
    const rec = map[item.id] || withReviewDraft(item, correctedRecord(item));
    map[item.id] = {
      ...rec,
      persisted: false,
      persist_error: String(err?.message || err || 'unknown error')
    };
    saveCorrections(map);
    if (status) status.textContent = `审批回写失败：${String(err?.message || err || 'unknown error')}`;
    return null;
  } finally {
    if (reviewBtn) reviewBtn.disabled = false;
  }
}

const reportSnapshotCacheV2 = new Map();
function reportSnapshotCacheKey(region=activeRegion()) {
  return JSON.stringify([
    String(region?.id || ''),
    String(state.classFilter || 'all'),
    String(state.search || '').trim().toLowerCase(),
    Number(reviewPriorityRevision || 0),
    String(state.liveDataUpdatedAt || ''),
    Array.isArray(region?.items) ? region.items.length : Number(region?.totalRows || 0)
  ]);
}
function buildRegionReportSnapshot(region=activeRegion()) {
  const cacheKey = reportSnapshotCacheKey(region);
  if (reportSnapshotCacheV2.has(cacheKey)) return reportSnapshotCacheV2.get(cacheKey);
  const items = reportScopeItems(region);
  const totalCount = items.length;
  const changedCount = items.filter(hasDetectedChange).length;
  const reviewCount = items.filter(item => isReviewCandidate(item, region)).length;
  const correctionEntries = reportCorrectionEntries(region, items);
  const scaleBuckets = reportScaleBuckets(items);
  const eventBuckets = reportEventBuckets(items, region);
  const riskBuckets = reportRiskBuckets(items);
  const reasonBuckets = reportReasonBuckets(items);
  const representatives = reportRepresentativeSamples(items, 5);
  const dominantEvent = state.classFilter === 'all'
    ? ((eventBuckets.find(row => row.key !== 'no_primary_event' && row.count > 0) || eventBuckets[0])?.label || '暂无主导主事件')
    : eventMeta(state.classFilter).zh;
  const dominantScale = reportPrimaryScale(scaleBuckets).label;
  const key = reportKey(region);
  const snapshot = {
    key,
    region,
    items,
    totalCount,
    changedCount,
    reviewCount,
    correctionEntries,
    scaleBuckets,
    eventBuckets,
    riskBuckets,
    reasonBuckets,
    representatives,
    dominantEvent,
    dominantScale,
    filterText: reportFilterText(region),
    generatedAt: state.regionReports[key]?.generatedAt || new Date().toISOString()
  };
  if (reportSnapshotCacheV2.size > 24) reportSnapshotCacheV2.clear();
  reportSnapshotCacheV2.set(cacheKey, snapshot);
  return snapshot;
}
function reportRecord(key=reportKey(activeRegion())) {
  if (!state.regionReports[key]) state.regionReports[key] = {generatedAt:new Date().toISOString(), summary:null, snapshotFingerprint:''};
  return state.regionReports[key];
}
function reportSnapshotFingerprint(snapshot) {
  return JSON.stringify({
    ...compactReportSnapshot(snapshot),
    corrections: (snapshot.correctionEntries || []).map(entry => [entry.itemId, entry.updated_at || '', entry.approved_at || ''])
  });
}
function syncLocalReportRecord(snapshot, force=false) {
  const record = reportRecord(snapshot.key);
  const fingerprint = reportSnapshotFingerprint(snapshot);
  if (!force && record.summary && record.snapshotFingerprint === fingerprint) return record;
  record.generatedAt = new Date().toISOString();
  record.snapshotFingerprint = fingerprint;
  record.summary = {
    status:'local',
    text:buildLocalReportSummary(snapshot),
    engine:'local facts summary',
    updatedAt:record.generatedAt
  };
  return record;
}
function runRegionReport(force=false) {
  const snapshot = buildRegionReportSnapshot(activeRegion());
  syncLocalReportRecord(snapshot, !!force);
  runRegionReportSummary(!!force, snapshot);
}
